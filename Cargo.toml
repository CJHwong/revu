[package]
name = "rs-github-inbox"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tui-markdown = "0.3.13"
unicode-width = "0.2.3"
