[package]
name = "revu"
version = "0.1.1"
edition = "2024"
description = "Your GitHub pull request inbox and review tool, in the terminal"
license = "MIT"
repository = "https://github.com/CJHwong/revu"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
ansi-to-tui = "8"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["osc52"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
unicode-width = "0.2.3"
