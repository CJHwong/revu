# Runs the format check, clippy and the tests on every push to main and every pull
# request. The release workflow runs it too, before it builds anything. On a pull request
# it also checks each commit message with commitlint.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit messages
        run: >-
          npx --yes -p @commitlint/cli@21 -p @commitlint/config-conventional@21
          commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
