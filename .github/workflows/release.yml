# Builds revu for macOS and Linux when a version tag is pushed, publishes the
# binaries as a GitHub Release, and updates the Homebrew formula.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          archive="revu-${{ matrix.target }}.tar.gz"
          cp target/${{ matrix.target }}/release/revu .
          tar -czf "$archive" revu LICENSE README.md
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write the checksums
        working-directory: dist
        run: sha256sum revu-*.tar.gz > checksums.txt && cat checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: dist/checksums.txt

  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    env:
      # A fine-grained token with write access to CJHwong/homebrew-tap.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for the tap token
        if: env.TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the Homebrew formula was not updated."
      - uses: actions/checkout@v7
        if: env.TAP_TOKEN != ''
      - uses: actions/download-artifact@v8
        if: env.TAP_TOKEN != ''
        with:
          name: checksums
      - name: Update the formula
        if: env.TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/CJHwong/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sh packaging/homebrew-formula.sh "$version" checksums.txt > tap/Formula/revu.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/revu.rb
          git commit -m "revu ${version}"
          git push
