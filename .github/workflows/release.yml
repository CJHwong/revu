# Checks, then builds revu for macOS and Linux when a version tag is pushed, publishes the
# binaries as a GitHub Release, and updates the Homebrew formula when the HOMEBREW_TAP_KEY
# secret is set.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          archive="revu-${{ matrix.target }}.tar.gz"
          cp target/${{ matrix.target }}/release/revu .
          tar -czf "$archive" revu LICENSE README.md
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write the checksums
        working-directory: dist
        run: sha256sum revu-*.tar.gz > checksums.txt && cat checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: dist/checksums.txt

  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    env:
      # The private half of a deploy key that can write to CJHwong/homebrew-tap only.
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
    steps:
      - name: Check for the tap key
        if: env.TAP_KEY == ''
        run: echo "::warning::HOMEBREW_TAP_KEY is not set. Update the Homebrew formula by hand, as RELEASING.md says."
      - uses: actions/checkout@v7
        if: env.TAP_KEY != ''
      - uses: actions/download-artifact@v8
        if: env.TAP_KEY != ''
        with:
          name: checksums
      - name: Update the formula
        if: env.TAP_KEY != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:CJHwong/homebrew-tap.git tap
          mkdir -p tap/Formula
          sh packaging/homebrew-formula.sh "$version" checksums.txt > tap/Formula/revu.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/revu.rb
          git commit -m "revu ${version}"
          git push
